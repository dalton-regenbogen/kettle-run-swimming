<!-- Shared <head> content for rebuilt pages. Each page keeps its own <title>. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Tells the browser the site has both a light and a dark version (affects scrollbars, form controls) -->
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@500..700&display=swap" />
<link rel="stylesheet" href="./css/output.css" />
<!--
  Site icon (favicon): the browser tab, bookmarks, and history. Browsers that understand SVG use the
  crisp favicon.svg; others use the small PNG. apple-touch-icon is what iPhones show when someone adds
  the site to their home screen (iOS needs a PNG with a solid background).
-->
<link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
