<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KR Swim | Practice Schedule</title>
    <link rel="stylesheet" href="./css/output.css" />
  </head>
  <body class="min-h-screen bg-gray-100 text-gray-900">
    <!-- include: header.html -->

    <!-- Main -->
    <main class="max-w-6xl md:max-w-10/12 mx-auto md:px-4 px-1 md:py-12 py-6">
      <section>
        <div
          class="md:rounded-2xl md:border md:border-gray-200 md:shadow-xs p-2 md:p-6 bg-grey-100 md:bg-white"
        >
          <!-- Hero band -->
          <section
            class="mb-8 overflow-hidden rounded-2xl border border-gray-200 bg-black/95 text-white"
          >
            <div class="relative px-6 py-4 md:py-8">
              <!-- subtle diagonal texture -->
              <div
                aria-hidden="true"
                class="pointer-events-none absolute inset-0 opacity-[0.12]"
                style="
                  background-image: repeating-linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.9) 0px,
                    rgba(255, 255, 255, 0.9) 1px,
                    transparent 1px,
                    transparent 10px
                  );
                "
              ></div>

              <div
                class="relative flex flex-col gap-2.5 text-center md:text-start md:flex-row md:items-end md:justify-between"
              >
                <div class="flex flex-col items-center gap-2 md:items-start">
                  <p
                    class="text-[10px] md:text-xs font-semibold uppercase tracking-[0.22em] text-white/80"
                  >
                    Kettle Run Swimming
                  </p>
                  <h1
                    class="text-3xl md:text-4xl font-extrabold tracking-tight"
                  >
                    Practice Schedule
                  </h1>
                  <p class="text-xs md:text-sm text-white/80">
                    Official 2025-2026 practice schedule.
                  </p>
                </div>

                <div
                  class="md:hidden border-b border-gray-400 w-64 m-auto"
                ></div>

                <!-- quick stat pills -->
                <div class="">
                  <a
                    id="recordsPdfLink"
                    href=""
                    class="rounded-md bg-gray-50 px-2 py-1 md:py-2 text-xs font-semibold text-black"
                    download
                  >
                    Download Schedule (PDF)
                  </a>
                </div>
                <p
                  id="scheduleLastUpdatedMobile"
                  class="md:hidden text-[10px] md:text-[11px] font-semibold text-white text-center"
                ></p>
              </div>
            </div>
          </section>

          <div id="practiceScheduleMount"></div>
        </div>
      </section>
    </main>

    <!-- include: footer.html -->

    <script src="./js/mobileMenu.js"></script>
    <script type="module">
      import { renderPracticeSchedule } from "./js/renderPracticeSchedule.js";

      renderPracticeSchedule({
        jsonUrl: "./assets/data/practice-schedule.json",
        mount: "#practiceScheduleMount",
      });
    </script>
  </body>
</html>
