<!doctype html>
<html lang="en">
  <head>
    <!-- include: head.html -->
    <title>Practice Schedule | Kettle Run Swimming</title>
    <meta name="description" content="Kettle Run High School swim team practice schedule: regular days and times, and the season week by week with days off." />
  </head>
  <body class="flex min-h-dvh flex-col bg-page font-body text-fg antialiased">
    <!-- include: site-header.html -->

    <main class="mx-auto w-full max-w-6xl flex-1 px-3 py-6 md:px-4 md:py-12">
      <!-- Page card: on desktop everything sits inside one large white card -->
      <div class="md:rounded-2xl md:border md:border-line md:bg-surface md:p-6 md:shadow-xs">
        <!-- Hero band -->
        <section class="relative mb-6 overflow-hidden rounded-2xl bg-black text-white md:mb-8 dark:ring-1 dark:ring-white/15">
          <div class="hero-texture pointer-events-none absolute inset-0" aria-hidden="true"></div>
          <div class="relative flex flex-col items-center gap-3 px-6 py-6 text-center md:flex-row md:items-end md:justify-between md:py-8 md:text-left">
            <div>
              <p class="type-label tracking-[0.22em] text-white/80">Kettle Run Swimming</p>
              <h1 class="type-title mt-1.5">Practice Schedule</h1>
              <p class="type-small mt-1 text-white/80">Official <span id="practice-season">KRHS</span> practice schedule.</p>
            </div>
            <!-- Filled in by the page script; hidden until it has text -->
            <p id="practice-updated" class="type-small rounded-md bg-white/20 px-2 py-1 font-medium text-white empty:hidden"></p>
          </div>
        </section>

        <!-- Week by week: Week · one column per practice day (filled in by js/practice.js) -->
        <section class="overflow-hidden rounded-2xl border border-line bg-surface shadow-sm" aria-labelledby="weeks-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="weeks-heading">Week by week</h2>
              <!-- "Standard practice schedule: Monday–Thursday, 3:30–4:30 PM @ WARF" (js/practice.js) -->
              <p id="regular-schedule" class="type-small text-fg-muted">Every practice day of the season</p>
            </div>
          </div>
          <table class="type-table w-full table-fixed">
            <thead class="bg-brand text-white">
              <tr id="weeks-head" class="text-left"></tr>
            </thead>
            <tbody id="weeks-body">
              <tr><td class="px-4 py-6 text-center text-fg-subtle" colspan="5">Loading…</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <!-- include: site-footer.html -->

    <script src="./js/site.js"></script>
    <script src="./js/practice.js"></script>
  </body>
</html>
