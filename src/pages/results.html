<!doctype html>
<html lang="en">
  <head>
    <!-- include: head.html -->
    <title>Meet Results | Kettle Run Swimming</title>
    <meta name="description" content="Kettle Run High School swim team meet results: dual meet scores, championship places, and the season record for boys and girls." />
  </head>
  <body class="flex min-h-dvh flex-col bg-page font-body text-fg antialiased">
    <!-- include: site-header.html -->

    <main class="mx-auto w-full max-w-6xl flex-1 px-3 py-6 md:px-4 md:py-12">
      <!-- Page card: on desktop everything sits inside one large white card -->
      <div class="md:rounded-2xl md:border md:border-line md:bg-surface md:p-6 md:shadow-xs">
        <!-- Hero band -->
        <section class="relative mb-6 overflow-hidden rounded-2xl bg-black text-white md:mb-8 dark:ring-1 dark:ring-white/15">
          <div class="hero-texture pointer-events-none absolute inset-0" aria-hidden="true"></div>
          <div class="relative flex flex-col items-center gap-3 px-6 py-6 text-center md:flex-row md:items-end md:justify-between md:py-8 md:text-left">
            <div>
              <p class="type-label tracking-[0.22em] text-white/80">Kettle Run Swimming</p>
              <h1 class="type-title mt-1.5">Meet Results</h1>
              <p class="type-small mt-1 text-white/80">Official <span id="results-season">KRHS</span> meet results.</p>
            </div>
            <!-- Filled in by js/results.js; hidden until it has text -->
            <p id="results-updated" class="type-small rounded-md bg-white/20 px-2 py-1 font-medium text-white empty:hidden"></p>
          </div>
        </section>

        <!-- 1. Season summary (counted from the scores by js/results.js) -->
        <section class="mb-6 overflow-hidden rounded-2xl border border-line bg-surface shadow-sm md:mb-8" aria-labelledby="summary-heading">
          <div class="flex flex-col gap-4 border-b border-line px-4 py-4 md:flex-row md:items-center md:justify-between md:px-5">
            <div class="flex items-center gap-3">
              <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
              <div>
                <h2 class="type-section" id="summary-heading">Season summary</h2>
                <p class="type-small text-fg-muted">Dual meet record and postseason places</p>
              </div>
            </div>
            <!-- Season picker (same as the Roster page); hidden while there's only one season -->
            <div data-season-picker hidden class="flex items-center gap-2">
              <label for="season-select" class="type-small sr-only font-medium text-fg-muted md:not-sr-only">Season</label>
              <select id="season-select" class="rounded-lg border border-line bg-surface px-2.5 py-1.5 text-[13px] font-medium text-fg focus-visible:outline-hidden focus:border-fg-subtle"></select>
            </div>
          </div>
          <!-- Two layouts, drawn by js/results.js: phones get one row per stat (Boys | Girls columns);
               desktop gets one row per team. -->
          <div id="summary-phone" class="md:hidden"><p class="type-small px-4 py-3 text-fg-subtle">Loading…</p></div>
          <table id="summary-table" class="type-table hidden w-full table-fixed md:table">
            <thead id="summary-head" class="bg-brand text-white"></thead>
            <tbody>
              <tr><td class="px-4 py-6 text-center text-fg-subtle" colspan="7">Loading…</td></tr>
            </tbody>
          </table>
        </section>

        <!-- 2. Regular season and 3. Postseason -->
        <section class="mb-6 overflow-hidden rounded-2xl border border-line bg-surface shadow-sm md:mb-8" aria-labelledby="regular-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="regular-heading">Regular season</h2>
              <p class="type-small text-fg-muted">Dual meet scores</p>
            </div>
          </div>
          <!-- One card per meet, added by js/results.js -->
          <div id="regular-cards" class="space-y-3 p-3 md:p-4"><p class="type-small text-fg-subtle">Loading…</p></div>
        </section>

        <section class="overflow-hidden rounded-2xl border border-line bg-surface shadow-sm" aria-labelledby="post-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="post-heading">Postseason</h2>
              <p class="type-small text-fg-muted">Team places at championship meets</p>
            </div>
          </div>
          <!-- One card per meet, added by js/results.js -->
          <div id="post-cards" class="space-y-3 p-3 md:p-4"><p class="type-small text-fg-subtle">Loading…</p></div>
        </section>
      </div>
    </main>

    <!-- include: site-footer.html -->

    <script src="./js/site.js"></script>
    <script src="./js/results.js"></script>
  </body>
</html>
