<!doctype html>
<html lang="en">
  <head>
    <!-- include: head.html -->
    <title>Team Records | Kettle Run Swimming</title>
    <meta name="description" content="All-time fastest times by Kettle Run High School swimmers in each event." />
  </head>
  <body class="flex min-h-dvh flex-col bg-page font-body text-fg antialiased">
    <!-- include: site-header.html -->

    <main class="mx-auto w-full max-w-6xl flex-1 px-3 py-6 md:px-4 md:py-12">
      <!-- Page card: on desktop everything sits inside one large white card -->
      <div class="md:rounded-2xl md:border md:border-line md:bg-surface md:p-6 md:shadow-xs">
        <!-- Hero band -->
        <section class="relative mb-6 overflow-hidden rounded-2xl bg-black text-white md:mb-8 dark:ring-1 dark:ring-white/15">
          <div class="hero-texture pointer-events-none absolute inset-0" aria-hidden="true"></div>
          <div class="relative flex flex-col items-center gap-3 px-6 py-6 text-center md:flex-row md:items-end md:justify-between md:py-8 md:text-left">
            <div>
              <p class="type-label tracking-[0.22em] text-white/80">Kettle Run Swimming</p>
              <h1 class="type-title mt-1.5">Team Records</h1>
              <p class="type-small mt-1 text-white/80">Official KRHS swim team records (Yards).</p>
            </div>
            <!-- Filled in by js/records.js; hidden until it has text -->
            <p id="records-updated" class="type-small rounded-md bg-white/20 px-2 py-1 font-medium text-white empty:hidden"></p>
          </div>
        </section>

        <!-- Boys -->
        <section class="mb-6 overflow-hidden rounded-2xl border border-line bg-surface shadow-sm md:mb-8" aria-labelledby="boys-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="boys-heading">Boys Team Records</h2>
              <p class="type-small text-fg-muted">All-time best performances</p>
            </div>
          </div>
          <table class="type-table w-full md:table-fixed">
            <thead class="bg-brand text-white">
              <tr class="md:hidden">
                <th scope="col" class="px-4 py-2.5 text-left font-semibold">
                  <span class="flex justify-between"><span>Event | Name</span><span>Time | Date</span></span>
                </th>
              </tr>
              <tr class="hidden text-left md:table-row">
                <th scope="col" class="w-[20%] px-4 py-2.5 font-semibold">Event</th>
                <th scope="col" class="w-[18%] px-4 py-2.5 font-semibold">Time</th>
                <th scope="col" class="px-4 py-2.5 font-semibold">Record Holder</th>
                <th scope="col" class="w-[16%] px-4 py-2.5 font-semibold">Date</th>
              </tr>
            </thead>
            <tbody id="boys-records">
              <tr><td class="px-4 py-3 text-fg-subtle" colspan="4">Loading…</td></tr>
            </tbody>
          </table>
        </section>

        <!-- Girls -->
        <section class="overflow-hidden rounded-2xl border border-line bg-surface shadow-sm" aria-labelledby="girls-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="girls-heading">Girls Team Records</h2>
              <p class="type-small text-fg-muted">All-time best performances</p>
            </div>
          </div>
          <table class="type-table w-full md:table-fixed">
            <thead class="bg-brand text-white">
              <tr class="md:hidden">
                <th scope="col" class="px-4 py-2.5 text-left font-semibold">
                  <span class="flex justify-between"><span>Event | Name</span><span>Time | Date</span></span>
                </th>
              </tr>
              <tr class="hidden text-left md:table-row">
                <th scope="col" class="w-[20%] px-4 py-2.5 font-semibold">Event</th>
                <th scope="col" class="w-[18%] px-4 py-2.5 font-semibold">Time</th>
                <th scope="col" class="px-4 py-2.5 font-semibold">Record Holder</th>
                <th scope="col" class="w-[16%] px-4 py-2.5 font-semibold">Date</th>
              </tr>
            </thead>
            <tbody id="girls-records">
              <tr><td class="px-4 py-3 text-fg-subtle" colspan="4">Loading…</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <!-- include: site-footer.html -->

    <script src="./js/site.js"></script>
    <script src="./js/records.js"></script>
  </body>
</html>
