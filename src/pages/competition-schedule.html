<!doctype html>
<html lang="en">
  <head>
    <!-- include: head.html -->
    <title>Meet Schedule | Kettle Run Swimming</title>
    <meta name="description" content="Kettle Run High School swim team meet schedule: dates, start times, opponents, and locations for dual meets and championships." />
  </head>
  <body class="flex min-h-dvh flex-col bg-page font-body text-fg antialiased">
    <!-- include: site-header.html -->

    <main class="mx-auto w-full max-w-6xl flex-1 px-3 py-6 md:px-4 md:py-12">
      <!-- Page card: on desktop everything sits inside one large white card -->
      <div class="md:rounded-2xl md:border md:border-line md:bg-surface md:p-6 md:shadow-xs">
        <!-- Hero band -->
        <section class="relative mb-6 overflow-hidden rounded-2xl bg-black text-white md:mb-8 dark:ring-1 dark:ring-white/15">
          <div class="hero-texture pointer-events-none absolute inset-0" aria-hidden="true"></div>
          <div class="relative flex flex-col items-center gap-3 px-6 py-6 text-center md:flex-row md:items-end md:justify-between md:py-8 md:text-left">
            <div>
              <p class="type-label tracking-[0.22em] text-white/80">Kettle Run Swimming</p>
              <h1 class="type-title mt-1.5">Meet Schedule</h1>
              <p class="type-small mt-1 text-white/80">Official <span id="meets-season">KRHS</span> meet schedule.</p>
            </div>
            <!-- Filled in by the page script; hidden until it has text -->
            <p id="meets-updated" class="type-small rounded-md bg-white/20 px-2 py-1 font-medium text-white empty:hidden"></p>
          </div>
        </section>

        <!-- Schedule -->
        <section class="overflow-hidden rounded-2xl border border-line bg-surface shadow-sm" aria-labelledby="meets-heading">
          <div class="flex items-center gap-3 border-b border-line px-4 py-4 md:px-5">
            <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
            <div>
              <h2 class="type-section" id="meets-heading">Full schedule</h2>
              <p class="type-small text-fg-muted">Dual meets and championships</p>
            </div>
          </div>
          <!--
            Phones: Date · Meet · Time. Desktop: Date · Meet · Location · Time. Rows are filled in by js/meets.js.
            Each header row's widths add up to 100%, so the columns hidden at one size can't take up space.
          -->
          <table class="type-table w-full table-fixed">
            <thead class="bg-brand text-white">
              <tr class="text-left md:hidden">
                <th scope="col" class="w-[17%] py-2.5 pr-1 pl-3 font-semibold">Date</th>
                <th scope="col" class="w-[61%] py-2.5 pr-2 font-semibold">Meet</th>
                <th scope="col" class="w-[22%] py-2.5 pr-3 font-semibold">Time</th>
              </tr>
              <tr class="hidden text-left md:table-row">
                <th scope="col" class="w-[12%] px-5 py-2.5 font-semibold">Date</th>
                <th scope="col" class="w-[40%] px-5 py-2.5 font-semibold">Meet</th>
                <th scope="col" class="w-[34%] px-5 py-2.5 font-semibold">Location</th>
                <th scope="col" class="w-[14%] px-5 py-2.5 font-semibold">Time</th>
              </tr>
            </thead>
            <tbody id="meets-body">
              <tr><td class="px-4 py-6 text-center text-fg-subtle" colspan="4">Loading…</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <!-- include: site-footer.html -->

    <script src="./js/site.js"></script>
    <script src="./js/meets.js"></script>
  </body>
</html>
