<!doctype html>
<!--
  This page moved to results.html (which now has a season picker instead of one page per season).
  Old links and bookmarks land here and are sent on:
  - meta refresh with 0 seconds: the browser goes to the new address right away.
  - rel="canonical": tells search engines the new address is the real one.
  - The visible link is a fallback in case the browser doesn't follow the refresh.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./results.html" />
    <link rel="canonical" href="https://kettlerunswim.org/results.html" />
    <title>Moved to Meet Results | Kettle Run Swimming</title>
  </head>
  <body>
    <p>This page has moved to <a href="./results.html">Meet Results</a>.</p>
  </body>
</html>
