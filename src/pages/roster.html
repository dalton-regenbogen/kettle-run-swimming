<!doctype html>
<html lang="en">
  <head>
    <!-- include: head.html -->
    <title>Team Roster | Kettle Run Swimming</title>
    <meta name="description" content="Kettle Run High School swim team rosters by season, with boys and girls teams." />
  </head>
  <body class="flex min-h-dvh flex-col bg-page font-body text-fg antialiased">
    <!-- include: site-header.html -->

    <main class="mx-auto w-full max-w-6xl flex-1 px-3 py-6 md:px-4 md:py-12">
      <!-- Page card: on desktop everything sits inside one large white card -->
      <div class="md:rounded-2xl md:border md:border-line md:bg-surface md:p-6 md:shadow-xs">
        <!-- Hero band -->
        <section class="relative mb-6 overflow-hidden rounded-2xl bg-black text-white md:mb-8 dark:ring-1 dark:ring-white/15">
          <div class="hero-texture pointer-events-none absolute inset-0" aria-hidden="true"></div>
          <div class="relative flex flex-col items-center gap-3 px-6 py-6 text-center md:flex-row md:items-end md:justify-between md:py-8 md:text-left">
            <div>
              <p class="type-label tracking-[0.22em] text-white/80">Kettle Run Swimming</p>
              <h1 class="type-title mt-1.5">Team Roster</h1>
              <p class="type-small mt-1 text-white/80">Official KRHS swim team rosters.</p>
            </div>
            <!-- Filled in by js/roster.js for the season shown; hidden until it has text -->
            <p id="roster-updated" class="type-small rounded-md bg-white/20 px-2 py-1 font-medium text-white empty:hidden"></p>
          </div>
        </section>

        <!-- Roster -->
        <section class="overflow-hidden rounded-2xl border border-line bg-surface shadow-sm" aria-labelledby="roster-heading">
          <!-- Section header: title on the left, season + team controls on the right (stacked on phones) -->
          <div class="flex flex-col gap-4 border-b border-line px-4 py-4 md:flex-row md:items-center md:justify-between md:px-5">
            <div class="flex items-center gap-3">
              <div class="h-9 w-1.5 rounded-full bg-accent" aria-hidden="true"></div>
              <div>
                <h2 class="type-section" id="roster-heading">Roster <span id="roster-season" class="ml-0.5 font-body text-[13px] font-normal tracking-normal text-fg-subtle"></span></h2>
                <p class="type-small text-fg-muted">Official KRHS swim team roster</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 md:justify-end">
              <div class="flex items-center gap-2">
                <label for="season-select" class="type-small sr-only font-medium text-fg-muted md:not-sr-only">Season</label>
                <select id="season-select" class="rounded-lg border border-line bg-surface px-2.5 py-1.5 text-[13px] font-medium text-fg focus-visible:outline-hidden focus:border-fg-subtle">
                  <option>Loading…</option>
                </select>
              </div>
              <div class="inline-flex gap-1 rounded-lg bg-fg/5 p-1" role="group" aria-label="Show team">
                <button type="button" data-team-filter="All" aria-pressed="true" class="rounded-md px-2.5 py-1 text-[12px] font-semibold text-fg-muted transition-colors aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">All</button>
                <button type="button" data-team-filter="Boys" aria-pressed="false" class="rounded-md px-2.5 py-1 text-[12px] font-semibold text-fg-muted transition-colors aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">Boys</button>
                <button type="button" data-team-filter="Girls" aria-pressed="false" class="rounded-md px-2.5 py-1 text-[12px] font-semibold text-fg-muted transition-colors aria-pressed:bg-surface aria-pressed:text-fg aria-pressed:shadow-sm">Girls</button>
              </div>
            </div>
          </div>

          <table class="type-table w-full table-fixed">
            <thead class="bg-brand text-white">
              <tr class="text-left">
                <th scope="col" class="w-13 py-2.5 pl-3 md:w-17 md:px-4"><span class="sr-only">Initials</span></th>
                <th scope="col" class="py-2.5 pr-2 font-semibold md:px-4">Athlete</th>
                <th scope="col" class="w-10 py-2.5 pr-2 font-semibold md:w-[16%] md:px-4">
                  <span class="md:hidden" aria-hidden="true">Yr</span><span class="sr-only md:not-sr-only">Year on Team</span>
                </th>
                <th scope="col" class="w-12 py-2.5 pr-2 font-semibold md:w-[14%] md:px-4">Class</th>
                <th scope="col" class="w-15 py-2.5 pr-3 font-semibold md:w-[14%] md:px-4">Stroke</th>
              </tr>
            </thead>
            <tbody id="roster-body">
              <tr><td class="px-4 py-6 text-center text-fg-subtle" colspan="5">Loading…</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>

    <!-- include: site-footer.html -->

    <script src="./js/site.js"></script>
    <script src="./js/roster.js"></script>
  </body>
</html>
